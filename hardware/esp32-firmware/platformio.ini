; PlatformIO Project Configuration File
; Omni-Context ESP32 神经末梢固件
;
; 使用方法:
; 1. 安装 PlatformIO: https://platformio.org/install
; 2. 打开终端，进入此目录
; 3. 编译: pio run
; 4. 上传: pio run --target upload
; 5. 串口监控: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口监视器配置
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 编译优化
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -Os

; 库依赖
lib_deps = 
    ; 无额外依赖，使用 Arduino 内置库

; 上传配置
upload_speed = 921600
upload_port = 
    ; 自动检测，或手动指定如: /dev/ttyUSB0 或 COM3

; OTA 配置 (可选)
; upload_protocol = espota
; upload_port = 192.168.1.xxx  ; ESP32 的 IP 地址
; upload_flags = 
;     --port=3232
;     --auth=omni2024

; 分区表 (可选，用于更大的 OTA 分区)
; board_build.partitions = huge_app.csv

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Os

; 调试配置 (需要调试器)
; [env:esp32dev-debug]
; platform = espressif32
; board = esp32dev
; framework = arduino
; build_type = debug
; debug_tool = esp-prog
; debug_init_break = tbreak setup
