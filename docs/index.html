<script>
  const I18N = { en: { html: 'en', title: 'Omni-Context — Long-term memory for any AI', toggle: '中文' },
                 zh: { html: 'zh', title: 'Omni-Context — 给任何 AI 装上长期记忆', toggle: 'EN' } };

  function applyLang(lang) {
    document.querySelectorAll('[data-en]').forEach(el => { el.innerHTML = el.dataset[lang]; });
    document.documentElement.lang = I18N[lang].html;
    document.title = I18N[lang].title;
    document.getElementById('langToggle').textContent = I18N[lang].toggle;
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }

  let lang = 'en';
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'en' || saved === 'zh') lang = saved;
    else if ((navigator.language || '').toLowerCase().startsWith('zh')) lang = 'zh';
  } catch (e) {}
  applyLang(lang);

  document.getElementById('langToggle').addEventListener('click', () => {
    lang = (lang === 'en') ? 'zh' : 'en';
    applyLang(lang);
  });

  // sticky nav bg on scroll
  const nav = document.querySelector('nav');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 24);
  onScroll(); window.addEventListener('scroll', onScroll, { passive: true });

  // scroll reveal
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
