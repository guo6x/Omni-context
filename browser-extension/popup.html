<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00c8ff;
    }
    .status-dot.connected { background: #00ff88; }
    .status-dot.disconnected { background: #ff4444; }
    .status span { font-size: 13px; opacity: 0.8; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .action-btn:hover {
      background: rgba(0,200,255,0.1);
      border-color: rgba(0,200,255,0.3);
    }
    .action-btn svg { opacity: 0.8; }
    .quick-stats {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .stat-label { opacity: 0.6; }
    .stat-value { font-weight: 500; color: #00c8ff; }
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="width:32px;height:32px;background:linear-gradient(135deg,#00c8ff,#6400ff);border-radius:8px;display:flex;align-items:center;justify-content:center;">
      <span style="font-size:18px;">🧠</span>
    </div>
    <h1>Omni-Context</h1>
  </div>
  
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>
  
  <div class="actions">
    <button class="action-btn" onclick="capturePage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      Capture Current Page
    </button>
    <button class="action-btn" onclick="captureSelection()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Capture Selection
    </button>
    <button class="action-btn" onclick="openDesktop()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      Open Desktop App
    </button>
  </div>
  
  <div class="quick-stats">
    <div class="stat-row">
      <span class="stat-label">Today's Captures</span>
      <span class="stat-value" id="todayCount">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Total Memories</span>
      <span class="stat-value" id="totalCount">0</span>
    </div>
  </div>
  
  <div class="footer">
    Omni-Context v0.1.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
