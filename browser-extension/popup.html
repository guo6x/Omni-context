<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="content.css" rel="stylesheet">
</head>
<body class="w-[320px] bg-[#0a0b12] text-[#e8e8e8] font-sans p-5 m-0 selection:bg-cyan-500/30">
  <div class="flex items-center gap-3 mb-5 pb-4 border-b border-white/10">
    <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="oink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7df9ff"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#0ea5c4"/></linearGradient>
        <radialGradient id="ocore" cx="50%" cy="45%" r="58%"><stop offset="0" stop-color="#e6fdff"/><stop offset="1" stop-color="#19c4e0"/></radialGradient>
      </defs>
      <path d="M84.4 63.2 A36 36 0 1 1 84.4 36.8" fill="none" stroke="url(#oink)" stroke-width="7" stroke-linecap="round"/>
      <g stroke="#7df9ff" stroke-width="2.6" opacity="0.6" stroke-linecap="round"><line x1="50" y1="51" x2="50" y2="32"/><line x1="50" y1="51" x2="68" y2="61"/><line x1="50" y1="51" x2="33" y2="61"/></g>
      <circle cx="50" cy="32" r="5" fill="#00f2fe"/><circle cx="68" cy="61" r="4.5" fill="#a855f7"/><circle cx="33" cy="61" r="4.5" fill="#22d3ee"/><circle cx="50" cy="51" r="9" fill="url(#ocore)"/>
    </svg>
    <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Omni-Context</h1>
  </div>
  
  <div class="flex items-center gap-2 p-3 glass-panel mb-4 shadow-lg shadow-black/50">
    <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse" id="statusDot"></div>
    <span class="text-sm text-gray-300 font-medium" id="statusText">正在检查连接...</span>
  </div>

  <!-- Token 设置：首次使用时显示 -->
  <div id="tokenSetup" class="hidden mb-4 p-3 glass-panel border border-amber-500/30 rounded-lg space-y-2">
    <p class="text-xs text-amber-400 font-medium">需要本地 API Token</p>
    <p class="text-[10px] text-gray-400 leading-relaxed">
      请从桌面端的 <span class="text-cyan-400">设置 → 数据 → 本地 API Token</span> 复制 token，粘贴到下方：
    </p>
    <div class="flex gap-2">
      <input
        id="tokenInput"
        type="password"
        placeholder="粘贴 token..."
        class="flex-1 bg-black/40 border border-white/10 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-500"
      />
      <button
        id="saveTokenBtn"
        class="px-3 py-1.5 text-xs bg-cyan-600 hover:bg-cyan-500 text-white rounded transition-colors shrink-0"
      >
        保存
      </button>
    </div>
  </div>

  <!-- 问大脑：在任意标签页直接问你的记忆 -->
  <div class="mb-4">
    <div class="flex gap-2">
      <input id="askInput" type="text" placeholder="问问你的大脑…"
        class="flex-1 bg-black/40 border border-white/10 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-500" />
      <button id="askBtn"
        class="px-3 py-1.5 text-xs bg-cyan-600 hover:bg-cyan-500 text-white rounded transition-colors shrink-0">问</button>
    </div>
    <div id="askAnswer" class="hidden mt-2 p-3 glass-panel text-xs text-gray-300"
      style="max-height:170px;overflow-y:auto;white-space:pre-wrap;line-height:1.6"></div>
  </div>

  <div class="flex flex-col gap-2">
    <button id="capturePageBtn" class="flex items-center gap-3 px-4 py-3 glass-panel hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:shadow-[0_0_15px_rgba(34,211,238,0.15)] text-gray-200 transition-all duration-300 cursor-pointer group" aria-label="一键捕获全页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-cyan-400 group-hover:scale-110 transition-transform">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span class="font-medium text-sm">一键捕获全页</span>
    </button>
    <button id="captureSelectionBtn" class="flex items-center gap-3 px-4 py-3 glass-panel hover:bg-purple-900/30 hover:border-purple-500/30 hover:shadow-[0_0_15px_rgba(168,85,247,0.15)] text-gray-200 transition-all duration-300 cursor-pointer group" aria-label="捕获选中文本">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-purple-400 group-hover:scale-110 transition-transform">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span class="font-medium text-sm">捕获选中文本</span>
    </button>
  </div>
  
  <div class="mt-5 pt-4 border-t border-white/10">
    <div class="flex justify-between text-xs mb-2">
      <span class="text-gray-500">记忆总量</span>
      <span class="font-bold text-cyan-400 font-mono" id="todayCount">0</span>
    </div>
    <div class="flex justify-between text-xs">
      <span class="text-gray-500">关系连接</span>
      <span class="font-bold text-purple-400 font-mono" id="totalCount">0</span>
    </div>
  </div>
  
  <div class="mt-5 text-center text-[10px] text-gray-600 font-mono">
    Omni-Context v0.2.2
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
