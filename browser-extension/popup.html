<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="content.css" rel="stylesheet">
</head>
<body class="w-[320px] bg-[#0a0b12] text-[#e8e8e8] font-sans p-5 m-0 selection:bg-cyan-500/30">
  <div class="flex items-center gap-3 mb-5 pb-4 border-b border-white/10">
    <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(34,211,238,0.3)]">
      <span class="text-lg">🧠</span>
    </div>
    <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Omni-Context</h1>
  </div>
  
  <div class="flex items-center gap-2 p-3 glass-panel mb-4 shadow-lg shadow-black/50">
    <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse" id="statusDot"></div>
    <span class="text-sm text-gray-300 font-medium" id="statusText">正在检查连接...</span>
  </div>
  
  <div class="flex flex-col gap-2">
    <button id="capturePageBtn" class="flex items-center gap-3 px-4 py-3 glass-panel hover:bg-cyan-900/30 hover:border-cyan-500/30 hover:shadow-[0_0_15px_rgba(34,211,238,0.15)] text-gray-200 transition-all duration-300 cursor-pointer group" aria-label="一键捕获全页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-cyan-400 group-hover:scale-110 transition-transform">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span class="font-medium text-sm">一键捕获全页</span>
    </button>
    <button id="captureSelectionBtn" class="flex items-center gap-3 px-4 py-3 glass-panel hover:bg-purple-900/30 hover:border-purple-500/30 hover:shadow-[0_0_15px_rgba(168,85,247,0.15)] text-gray-200 transition-all duration-300 cursor-pointer group" aria-label="捕获选中文本">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-purple-400 group-hover:scale-110 transition-transform">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span class="font-medium text-sm">捕获选中文本</span>
    </button>
    <button id="openDesktopBtn" class="flex items-center gap-3 px-4 py-3 glass-panel hover:bg-gray-800/50 hover:border-gray-500/30 text-gray-200 transition-all duration-300 cursor-pointer group" aria-label="打开桌面图谱">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400 group-hover:text-white transition-colors">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      <span class="font-medium text-sm">打开桌面图谱</span>
    </button>
  </div>
  
  <div class="mt-5 pt-4 border-t border-white/10">
    <div class="flex justify-between text-xs mb-2">
      <span class="text-gray-500">今日捕获</span>
      <span class="font-bold text-cyan-400 font-mono" id="todayCount">0</span>
    </div>
    <div class="flex justify-between text-xs">
      <span class="text-gray-500">记忆总量</span>
      <span class="font-bold text-purple-400 font-mono" id="totalCount">0</span>
    </div>
  </div>
  
  <div class="mt-5 text-center text-[10px] text-gray-600 font-mono">
    Omni-Context v2.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
