<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1b2547" />
      <stop offset="100%" stop-color="#070914" />
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7df9ff" />
      <stop offset="100%" stop-color="#00bcd4" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" rx="112" ry="112" />

  <g transform="translate(256 256)">
    <circle r="172" fill="none" stroke="url(#cyan)" stroke-width="14" opacity="0.95" filter="url(#softGlow)" />

    <g stroke="url(#cyan)" stroke-width="3" opacity="0.4" stroke-linecap="round">
      <line x1="0" y1="-172" x2="0" y2="-58" />
      <line x1="149" y1="-86" x2="50" y2="-29" />
      <line x1="149" y1="86" x2="50" y2="29" />
      <line x1="0" y1="172" x2="0" y2="58" />
      <line x1="-149" y1="86" x2="-50" y2="29" />
      <line x1="-149" y1="-86" x2="-50" y2="-29" />
    </g>

    <g filter="url(#glow)">
      <circle cx="0"     cy="-172" r="22" fill="url(#cyan)" />
      <circle cx="149"   cy="-86"  r="20" fill="url(#purple)" />
      <circle cx="149"   cy="86"   r="20" fill="url(#purple)" />
      <circle cx="0"     cy="172"  r="22" fill="url(#cyan)" />
      <circle cx="-149"  cy="86"   r="20" fill="url(#purple)" />
      <circle cx="-149"  cy="-86"  r="20" fill="url(#purple)" />
    </g>

    <circle r="58" fill="url(#core)" filter="url(#glow)" />
    <circle r="22" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
