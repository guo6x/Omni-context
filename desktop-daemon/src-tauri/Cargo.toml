[package]
name = "omni-context-desktop"
version = "0.1.0"
description = "Omni-Context - 全域物理级 AI 记忆操作系统"
authors = ["Omni-Context Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["global-shortcut", "system-tray", "fs-read-file", "path-all", "shell-open", "clipboard-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
screenshots = "0.6"
base64 = "0.21"
arboard = "3.3"
image = "0.24"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
chrono = { version = "0.4", features = ["clock"] }
local-ip-address = "0.6"
getrandom = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
