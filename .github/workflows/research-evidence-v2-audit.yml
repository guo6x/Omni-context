name: Evidence Surface V2 Forensic Audit

on:
  push:
    branches:
      - research/evidence-surface-v2-strengthening
    paths:
      - 'research/evidence-surface-v1/p1/formal/**'
      - 'research/evidence-surface-v1/p2/out/**'
      - 'research/evidence-surface-v2/audit-v1-p2.mjs'
      - 'research/evidence-surface-v2/audit-v1-p2.test.mjs'
      - 'research/evidence-surface-v2/paired-world.schema.json'
      - 'research/evidence-surface-v2/validate-paired-world.mjs'
      - 'research/evidence-surface-v2/validate-paired-world.test.mjs'
      - 'research/evidence-surface-v2/dev/paired-world-toy.jsonl'
      - 'research/evidence-surface-v2/monitor-acquisition-ledger.mjs'
      - 'research/evidence-surface-v2/monitor-acquisition-ledger.test.mjs'
      - 'research/evidence-surface-v2/run-dev-policy-monitor.mjs'
      - 'research/evidence-surface-v2/monitor-stress.schema.json'
      - 'research/evidence-surface-v2/dev/monitor-stress.jsonl'
      - 'research/evidence-surface-v2/evaluate-monitor-stress.mjs'
      - 'research/evidence-surface-v2/evaluate-monitor-stress.test.mjs'
      - 'research/evidence-surface-v2/policy-currentness-first.mjs'
      - 'research/evidence-surface-v2/policy-currentness-first.test.mjs'
      - 'research/evidence-surface-v2/evaluate-independent-policy-v1.mjs'
      - 'research/evidence-surface-v2/evaluate-paired-world-policies.mjs'
      - 'research/evidence-surface-v2/evaluate-paired-world-policies.test.mjs'
      - 'research/evidence-surface-v2/validate-paired-world-b.mjs'
      - 'research/evidence-surface-v2/validate-paired-world-cross.test.mjs'
      - 'research/evidence-surface-v2/generate-dev-paired-worlds.mjs'
      - 'research/evidence-surface-v2/generate-dev-paired-worlds.test.mjs'
      - 'research/evidence-surface-v2/audit-dev-benchmark.mjs'
      - 'research/evidence-surface-v2/generated-dev-behavior.test.mjs'
      - 'research/evidence-surface-v2/execution-manifest.schema.json'
      - 'research/evidence-surface-v2/execution-results.schema.json'
      - 'research/evidence-surface-v2/execution-kernel.test.mjs'
      - 'research/evidence-surface-v2/run-paired-surface-matrix.test.mjs'
      - 'research/evidence-surface-v2/run-paired-surface-matrix.mjs'
      - 'research/evidence-surface-v2/execution-kernel.mjs'
      - 'research/evidence-surface-v2/policy-surface-vote.mjs'
      - '.github/workflows/research-evidence-v2-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-surface-v2-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lock forensic invariants
        run: node --test research/evidence-surface-v2/audit-v1-p2.test.mjs

      - name: Validate paired-world construction contract
        run: node --test research/evidence-surface-v2/validate-paired-world.test.mjs

      - name: Cross-check paired-world validators
        run: node --test research/evidence-surface-v2/validate-paired-world-cross.test.mjs

      - name: Validate non-oracle ledger monitor
        run: node --test research/evidence-surface-v2/monitor-acquisition-ledger.test.mjs

      - name: Validate monitor stress errors
        run: node --test research/evidence-surface-v2/evaluate-monitor-stress.test.mjs

      - name: Validate independent currentness policy
        run: node --test research/evidence-surface-v2/policy-currentness-first.test.mjs

      - name: Validate paired-world policy invariance
        run: node --test research/evidence-surface-v2/evaluate-paired-world-policies.test.mjs

      - name: Validate generated dev benchmark
        run: node --test research/evidence-surface-v2/generate-dev-paired-worlds.test.mjs

      - name: Validate generated dev behavior
        run: node --test research/evidence-surface-v2/generated-dev-behavior.test.mjs

      - name: Validate execution kernel contract
        run: |
          node --test research/evidence-surface-v2/execution-kernel.test.mjs
          node --test research/evidence-surface-v2/run-paired-surface-matrix.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('research/evidence-surface-v2/execution-results.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/evidence-surface-v2/execution-manifest.schema.json','utf8'))"

      - name: Generate machine audit
        run: |
          rm -rf research/evidence-surface-v2/out-ci
          node research/evidence-surface-v2/generate-dev-paired-worlds.mjs \
            research/evidence-surface-v2/out-ci/generated-dev-pairs.jsonl
          node research/evidence-surface-v2/audit-dev-benchmark.mjs \
            research/evidence-surface-v2/out-ci/generated-dev-audit.json
          node research/evidence-surface-v2/run-dev-policy-monitor.mjs \
            research/evidence-surface-v2/out-ci/generated-dev-pairs.jsonl \
            research/evidence-surface-v2/out-ci/generated-dev-monitor.json
          node research/evidence-surface-v2/evaluate-paired-world-policies.mjs \
            research/evidence-surface-v2/out-ci/generated-dev-pairs.jsonl \
            research/evidence-surface-v2/out-ci/generated-dev-policy-replication.json
          node research/evidence-surface-v2/audit-v1-p2.mjs research/evidence-surface-v2/out-ci
          node research/evidence-surface-v2/validate-paired-world.mjs \
            research/evidence-surface-v2/dev/paired-world-toy.jsonl \
            research/evidence-surface-v2/out-ci/paired-world-dev-validation.json
          node research/evidence-surface-v2/validate-paired-world-b.mjs \
            research/evidence-surface-v2/dev/paired-world-toy.jsonl \
            research/evidence-surface-v2/out-ci/paired-world-dev-validation-b.json
          node research/evidence-surface-v2/run-dev-policy-monitor.mjs \
            research/evidence-surface-v2/dev/paired-world-toy.jsonl \
            research/evidence-surface-v2/out-ci/paired-world-dev-monitor.json
          node research/evidence-surface-v2/evaluate-monitor-stress.mjs \
            research/evidence-surface-v2/dev/monitor-stress.jsonl \
            research/evidence-surface-v2/out-ci/monitor-stress.json
          node research/evidence-surface-v2/evaluate-independent-policy-v1.mjs \
            research/evidence-surface-v2/out-ci/independent-policy-v1.json
          node research/evidence-surface-v2/evaluate-paired-world-policies.mjs \
            research/evidence-surface-v2/dev/paired-world-toy.jsonl \
            research/evidence-surface-v2/out-ci/paired-world-policy-replication.json
          test -s research/evidence-surface-v2/out-ci/generated-dev-pairs.jsonl
          test -s research/evidence-surface-v2/out-ci/generated-dev-audit.json
          test -s research/evidence-surface-v2/out-ci/generated-dev-monitor.json
          test -s research/evidence-surface-v2/out-ci/generated-dev-policy-replication.json
          test -s research/evidence-surface-v2/out-ci/v1-p2-forensic-audit.json
          test -s research/evidence-surface-v2/out-ci/v1-p2-forensic-audit.md
          test -s research/evidence-surface-v2/out-ci/paired-world-dev-validation.json
          test -s research/evidence-surface-v2/out-ci/paired-world-dev-validation-b.json
          test -s research/evidence-surface-v2/out-ci/paired-world-dev-monitor.json
          test -s research/evidence-surface-v2/out-ci/monitor-stress.json
          test -s research/evidence-surface-v2/out-ci/independent-policy-v1.json
          test -s research/evidence-surface-v2/out-ci/paired-world-policy-replication.json
          echo "=== out-ci artifact inventory ==="
          ls -lah research/evidence-surface-v2/out-ci

      - name: Show key findings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/v1-p2-forensic-audit.json','utf8'));
          console.log('C1', a.by_condition.C1_HIDDEN);
          console.log('C2', a.by_condition.C2_LEXICAL);
          console.log('C3', a.by_condition.C3_HASH_DENSE);
          console.log('C4', a.by_condition.C4_HYBRID);
          console.log('F6 cue audit', a.f6_cue_audit);
          console.log('C5 oracle audit', a.c5_oracle_audit);
          const s=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/monitor-stress.json','utf8'));
          console.log('Monitor stress', {
            cases:s.cases,
            correct:s.correct_count,
            false_complete:s.false_complete_count,
            false_incomplete:s.false_incomplete_count
          });
          const p=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/independent-policy-v1.json','utf8'));
          console.log('Independent policy C1', p.by_condition.C1_HIDDEN);
          console.log('Independent policy F6 C1', p.by_family.F6.C1_HIDDEN);
          const q=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/paired-world-policy-replication.json','utf8'));
          console.log('Paired-world policy replication', q.by_policy);
          const d=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/generated-dev-audit.json','utf8'));
          console.log('Generated dev benchmark', {
            pairs:d.pairs,
            family_counts:d.family_counts,
            domain_counts:d.domain_counts,
            max_template_concentration:d.max_template_concentration,
            near_duplicates:d.near_duplicate_pairs.length,
            max_word_trigram_jaccard:d.max_word_trigram_jaccard,
            gates:d.gates
          });
          const gm=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/generated-dev-monitor.json','utf8'));
          console.log('Generated dev monitors', gm.by_condition);
          const gp=JSON.parse(fs.readFileSync('research/evidence-surface-v2/out-ci/generated-dev-policy-replication.json','utf8'));
          console.log('Generated dev policy replication', gp.by_policy);
          NODE

      - name: Upload forensic audit
        uses: actions/upload-artifact@v4
        with:
          name: evidence-surface-v2-v1-forensic-audit
          path: research/evidence-surface-v2/out-ci/
