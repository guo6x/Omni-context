name: Temporary Desktop Lock Refresh

on:
  push:
    branches:
      - docs/post-goal29-release-truth-sync
    paths:
      - desktop-daemon/package.json
      - desktop-daemon/package-lock.json
      - .github/workflows/temp-refresh-desktop-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-goal29-release-truth-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-daemon/package-lock.json
      - name: Regenerate desktop lockfile only
        working-directory: desktop-daemon
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify Next is build-only in lock metadata
        working-directory: desktop-daemon
        run: |
          node - <<'NODE'
          const l = require('./package-lock.json');
          const root = l.packages[''];
          if (!root.devDependencies || root.devDependencies.next !== '14.2.35') {
            console.error('root devDependency next mismatch', root.devDependencies && root.devDependencies.next);
            process.exit(1);
          }
          if (root.dependencies && root.dependencies.next) {
            console.error('next still classified as production root dependency');
            process.exit(1);
          }
          const p = l.packages['node_modules/next'];
          if (!p || p.dev !== true) {
            console.error('next lock package is not dev-only', p && p.dev);
            process.exit(1);
          }
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- desktop-daemon/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-daemon/package-lock.json
          git commit -m 'fix(security): refresh desktop lockfile build-only metadata [lock-refresh]'
          git push origin HEAD:docs/post-goal29-release-truth-sync
