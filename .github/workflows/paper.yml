name: Paper

on:
  push:
    paths: ['paper/**']
  pull_request:
    paths: ['paper/**']

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TECTONIC_VERSION: '0.16.9'
      TECTONIC_ARCHIVE_SHA256: '131a24604785a9600989a3d91225f597df52ac06f00aeffe86fd529f99ee5cdd'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: paper/build-requirements.txt
      - name: Install pinned asset validators
        run: python -m pip install --requirement paper/build-requirements.txt
      - name: Generate and validate paper assets
        run: |
          python paper/figure-scripts/generate_assets.py
          python paper/validate_assets.py
      - name: Install pinned Tectonic
        shell: pwsh
        run: |
          $url = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40$env:TECTONIC_VERSION/tectonic-$env:TECTONIC_VERSION-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile tectonic.zip
          $actual = (Get-FileHash tectonic.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TECTONIC_ARCHIVE_SHA256) { throw "Tectonic archive hash mismatch: $actual" }
          Expand-Archive tectonic.zip -DestinationPath .tectonic
          "TECTONIC_BIN=$((Resolve-Path .tectonic/tectonic.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TECTONIC_CACHE_DIR=$env:RUNNER_TEMP\tectonic-cache-0.16.9" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile and audit LaTeX
        shell: pwsh
        run: ./paper/build-paper.ps1
      - name: Verify no paid API or held-out access
        shell: pwsh
        run: |
          if ($env:LLM_API_KEY -or $env:MOONSHOT_API_KEY -or $env:OMNI_HELDOUT_AUTHORIZATION_FILE) { throw 'Forbidden evaluation environment present' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omni-context-draft-pdf
          path: |
            paper/build/main.pdf
            paper/evidence/latex-log-audit.json
          if-no-files-found: error
