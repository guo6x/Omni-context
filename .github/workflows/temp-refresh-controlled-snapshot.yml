name: Temporary Controlled Snapshot Refresh

on:
  push:
    branches:
      - docs/post-goal29-release-truth-sync
    paths:
      - desktop-daemon/package.json
      - desktop-daemon/src-tauri/tauri.conf.json
      - desktop-daemon/scripts/controlled-files.sha256.json
      - .github/workflows/temp-refresh-controlled-snapshot.yml

permissions:
  contents: write

jobs:
  refresh-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-goal29-release-truth-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh intentional controlled-file snapshot
        working-directory: desktop-daemon
        run: npm run snapshot:controlled
      - name: Verify controlled files against refreshed snapshot
        working-directory: desktop-daemon
        run: npm run verify:controlled
      - name: Ensure only baseline metadata changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "desktop-daemon/scripts/controlled-files.sha256.json"
      - name: Commit refreshed controlled baseline
        run: |
          if git diff --quiet -- desktop-daemon/scripts/controlled-files.sha256.json; then
            echo 'Controlled snapshot already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-daemon/scripts/controlled-files.sha256.json
          git commit -m 'chore(release): refresh intentional controlled-file baseline [snapshot-refresh]'
          git push origin HEAD:docs/post-goal29-release-truth-sync
