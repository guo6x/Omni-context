name: Build Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 只用 macos-14（Apple Silicon/arm64）。Intel 的 macos-13 在本仓库的
        # 免费额度下长期分配不到 runner（实测排队 1 小时无进展），故移除；Intel Mac
        # 用户走源码构建。Linux 只打 .deb：runner 上 webkit 版本过新，Tauri v1 的
        # appimage.sh 适配不了 AppImage 打包，deb 稳定可用。
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
            bundleArgs: --bundles deb
          - os: macos-14
            label: macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # 仓库根没有 lockfile，npm 缓存键由两个子项目的 lockfile 计算。
          cache-dependency-path: |
            desktop-daemon/package-lock.json
            brain-server/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies (desktop-daemon)
        run: npm install
        working-directory: desktop-daemon

      - name: Install dependencies (brain-server)
        run: npm install
        working-directory: brain-server

      - name: Build Brain Server
        run: npm run build
        working-directory: brain-server

      - name: Copy Brain Server into Tauri resources
        shell: bash
        run: |
          DST="desktop-daemon/src-tauri/brain-server"
          mkdir -p "$DST"
          # Preserve models/ if present
          for name in $(ls "$DST" 2>/dev/null || true); do
            if [ "$name" != "models" ]; then
              rm -rf "$DST/$name"
            fi
          done
          mkdir -p "$DST/dist"
          cp -r brain-server/dist/* "$DST/dist/"
          cp brain-server/package.json "$DST/"
          if [ -f brain-server/package-lock.json ]; then
            cp brain-server/package-lock.json "$DST/"
          fi
          # Install production deps
          cd "$DST"
          npm install --omit=dev --no-audit --no-fund

      - name: Embed Node binary
        shell: bash
        run: |
          DST="desktop-daemon/src-tauri/brain-server"
          NODE_BIN="node"
          if [ "${{ runner.os }}" = "Windows" ]; then
            NODE_BIN="node.exe"
          fi
          cp "$(which node)" "$DST/$NODE_BIN"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$DST/$NODE_BIN"
          fi
          echo "Embedded $NODE_BIN: $(which node)"

      - name: Build Next.js frontend
        run: npm run build
        working-directory: desktop-daemon

      - name: Build Tauri app
        # 用 CI 专用配置（updater 关闭），无需 TAURI_PRIVATE_KEY 也能产出安装包。
        # 需要带签名/自动更新的正式发布走 release.yml（配 TAURI_PRIVATE_KEY secret）。
        run: npx tauri build -c src-tauri/tauri.ci.conf.json ${{ matrix.bundleArgs }}
        working-directory: desktop-daemon

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop-daemon/src-tauri/target/release/bundle/msi/*.msi
            desktop-daemon/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-dmg
          path: |
            desktop-daemon/src-tauri/target/release/bundle/macos/*.app
            desktop-daemon/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            desktop-daemon/src-tauri/target/release/bundle/deb/*.deb
