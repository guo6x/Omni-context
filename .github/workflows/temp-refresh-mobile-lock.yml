name: Temporary Mobile Lock Refresh

on:
  push:
    branches:
      - docs/post-goal29-release-truth-sync
    paths:
      - mobile-app/package.json
      - mobile-app/package-lock.json
      - .github/workflows/temp-refresh-mobile-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-goal29-release-truth-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Regenerate mobile lockfile only
        working-directory: mobile-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify tar override resolution
        working-directory: mobile-app
        run: |
          node - <<'NODE'
          const l = require('./package-lock.json');
          const root = l.packages[''];
          if (!root.overrides || root.overrides.tar !== '7.5.22') {
            console.error('root tar override mismatch', root.overrides && root.overrides.tar);
            process.exit(1);
          }
          const tarEntries = Object.entries(l.packages)
            .filter(([k, p]) => (k === 'node_modules/tar' || k.endsWith('/node_modules/tar')) && p && p.version)
            .map(([k, p]) => [k, p.version]);
          if (tarEntries.length === 0 || tarEntries.some(([, v]) => v !== '7.5.22')) {
            console.error('unexpected tar resolution', tarEntries);
            process.exit(1);
          }
          console.log('tar entries', tarEntries);
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- mobile-app/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-app/package-lock.json
          git commit -m 'fix(security): refresh mobile lockfile for tar 7.5.22 [lock-refresh]'
          git push origin HEAD:docs/post-goal29-release-truth-sync
