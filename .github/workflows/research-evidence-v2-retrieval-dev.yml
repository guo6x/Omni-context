name: Evidence Surface V2 Retrieval Dev

on:
  push:
    branches:
      - research/evidence-surface-v2-strengthening
    paths:
      - 'research/evidence-surface-v2/generate-dev-paired-worlds.mjs'
      - 'research/evidence-surface-v2/generate-dev-retrieval-store.mjs'
      - 'research/evidence-surface-v2/generate-dev-retrieval-store.test.mjs'
      - 'research/evidence-surface-v2/run-dev-retrievers.py'
      - 'research/evidence-surface-v2/score-dev-retrieval.mjs'
      - 'research/evidence-surface-v2/score-dev-retrieval.test.mjs'
      - 'research/evidence-surface-v2/policy-currentness-first.test.mjs'
      - 'research/evidence-surface-v2/policy-currentness-first.mjs'
      - 'research/evidence-surface-v2/RETRIEVAL_DEV_PROTOCOL.md'
      - '.github/workflows/research-evidence-v2-retrieval-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             sentence-transformers==6.1.0             rank-bm25==0.2.2

      - name: Record resolved environment
        run: |
          mkdir -p research/evidence-surface-v2/out-retrieval-dev
          python --version | tee research/evidence-surface-v2/out-retrieval-dev/python-version.txt
          python -m pip freeze | sort > research/evidence-surface-v2/out-retrieval-dev/pip-freeze.txt

      - name: Validate source-store construction
        run: node --test research/evidence-surface-v2/generate-dev-retrieval-store.test.mjs

      - name: Validate downstream scoring semantics
        run: |
          node --test research/evidence-surface-v2/policy-currentness-first.test.mjs
          node --test research/evidence-surface-v2/score-dev-retrieval.test.mjs

      - name: Generate development retrieval input and isolated truth
        run: |
          node research/evidence-surface-v2/generate-dev-retrieval-store.mjs \
            research/evidence-surface-v2/out-retrieval-dev/retriever-input.jsonl \
            research/evidence-surface-v2/out-retrieval-dev/scoring-truth.jsonl

      - name: Run BM25 and pinned BGE on retriever-only input
        run: |
          python research/evidence-surface-v2/run-dev-retrievers.py \
            research/evidence-surface-v2/out-retrieval-dev/retriever-input.jsonl \
            research/evidence-surface-v2/out-retrieval-dev/rankings.json

      - name: Score downstream development behavior after truth join
        run: |
          node research/evidence-surface-v2/score-dev-retrieval.mjs \
            research/evidence-surface-v2/out-retrieval-dev/retriever-input.jsonl \
            research/evidence-surface-v2/out-retrieval-dev/scoring-truth.jsonl \
            research/evidence-surface-v2/out-retrieval-dev/rankings.json \
            research/evidence-surface-v2/out-retrieval-dev/scored.json

      - name: Build development summary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const dir='research/evidence-surface-v2/out-retrieval-dev';
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const scored=JSON.parse(fs.readFileSync(dir+'/scored.json','utf8'));
          const rankings=JSON.parse(fs.readFileSync(dir+'/rankings.json','utf8'));
          const summary={
            schema_version:1,
            status:'DEVELOPMENT_ONLY',
            retriever_input_sha256:sha(dir+'/retriever-input.jsonl'),
            scoring_truth_sha256:sha(dir+'/scoring-truth.jsonl'),
            rankings_sha256:sha(dir+'/rankings.json'),
            scored_sha256:sha(dir+'/scored.json'),
            retrievers:rankings.retrievers,
            budgets:rankings.budgets,
            results:scored.summary
          };
          fs.writeFileSync(dir+'/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Upload development retrieval artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-surface-v2-retrieval-development
          path: research/evidence-surface-v2/out-retrieval-dev/
